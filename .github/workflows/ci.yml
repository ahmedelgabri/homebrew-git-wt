name: CI

on:
  push:
    branches: [main]
  schedule:
    # Run weekly to catch any issues with upstream changes
    - cron: "0 0 * * 0"

jobs:
  test:
    name: Test Formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap this repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/ahmedelgabri"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/ahmedelgabri/homebrew-git-wt"

      - name: Install formula
        run: brew install --verbose ahmedelgabri/git-wt/git-wt

      - name: Test formula
        run: brew test ahmedelgabri/git-wt/git-wt

      - name: Audit formula
        run: brew audit --strict ahmedelgabri/git-wt/git-wt
